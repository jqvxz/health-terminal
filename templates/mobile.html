<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HealthTerminal — Mobile Not Supported">
    <title>HealthTerminal — Desktop Only</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Geist', -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            border: 1px solid #333;
            padding: 32px;
            border-radius: 4px;
            background: #111;
            text-align: left;
        }
        h1 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 16px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 0.875rem;
            color: #888;
            line-height: 1.5;
            margin: 0 0 24px 0;
        }
        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 32px;
            letter-spacing: -0.04em;
        }
        .logo span {
            color: #bfff00;
        }
        .btn {
            display: inline-block;
            background: #bfff00;
            color: #000;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div>
        <div class="logo">Health<span>Terminal</span></div>
        <div class="container">
            <h1>Mobile Not Supported</h1>
            <p>HealthTerminal V1.0 is currently optimized exclusively for desktop and tablet displays.</p>
            <p>Please access the platform from a device with a wider screen to experience the full data density and performance tracking capabilities.</p>
            <a href="/" class="btn" onclick="sessionStorage.setItem('forceDesktop', 'true');">I am on a tablet/desktop</a>
        </div>
    </div>
</body>
</html>
